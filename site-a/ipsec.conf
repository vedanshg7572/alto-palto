# strongSwan IPSec configuration - Site A (HQ)
# My public IP: 203.0.113.1
# Site-B public IP: 203.0.113.2

config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=no

conn site-a-to-site-b
    # connection type
    type=tunnel
    auto=start

    # local side (Site-A)
    left=203.0.113.1
    leftsubnet=192.168.1.0/24
    leftid=@site-a

    # remote side (Site-B)
    right=203.0.113.2
    rightsubnet=192.168.2.0/24
    rightid=@site-b

    # IKE Phase 1 settings
    ike=aes256-sha256-modp2048!
    ikelifetime=28800s

    # ESP Phase 2 settings
    esp=aes256-sha256!
    lifetime=3600s

    # use pre-shared key
    authby=secret

    # keep tunnel alive
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s

    # NAT traversal (just in case)
    keyexchange=ikev2
