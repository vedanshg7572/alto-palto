# strongSwan IPSec configuration - Site B (Branch Office)
# My public IP: 203.0.113.2
# Site-A public IP: 203.0.113.1

config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=no

conn site-b-to-site-a
    type=tunnel
    auto=start

    # local side (Site-B)
    left=203.0.113.2
    leftsubnet=192.168.2.0/24
    leftid=@site-b

    # remote side (Site-A)
    right=203.0.113.1
    rightsubnet=192.168.1.0/24
    rightid=@site-a

    # IKE Phase 1
    ike=aes256-sha256-modp2048!
    ikelifetime=28800s

    # Phase 2
    esp=aes256-sha256!
    lifetime=3600s

    authby=secret
    keyexchange=ikev2

    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s
